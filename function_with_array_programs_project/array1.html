<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    
    <div class="container">
      <div class="row ">
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
          <div class="card-body d-flex flex-column">
            <h1 class="text-center">Splice function</h1>
            <input type="text" id="arr" placeholder="enter array 1,2,3,4,5,..." >
            <br><br>

            <input type="number" id="input" placeholder="add index">            
            <br><br>

            <input type="number" id="value" placeholder="value">           
            <br><br>

            <button onclick="add()">Add</button>
            <button onclick="remove()">Remove</button>
             <button onclick="replace()">replace</button>
            
            <h3 id="result"></h3>

          </div>
        </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
            <div class="card" style="width: 18rem;">
              <div class="card-body d-flex flex-column">
                <h1 class="text-center">some method</h1>
               <input type="text" id="someArr" placeholder="enter array 1,2,3,4,5,..." >
               <br><br>

               <input type="number" id="value" placeholder="check value" >
               <br><br>

               <button id="some" onclick="some()">Some</button>

               <h3 id="someResult"></h3>
              </div>
            </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="car-body d-flex flex-column">
              <h1 class="text-center mt-4">Reverse method</h1>

              <input type="text" id="Rev" placeholder="enter array 1,2,3,...">
              <br><br>
              <button id="revBtn" onclick="reverse()">Reverse</button>

              <h3 id="revResult"></h3>
            </div>
          </div>
        </div>
        
      </div>

      <div class="row">
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">

              <h1 class="text-center">reduce() method</h1>

              <input type="text" id="reduce" placeholder="Enter number(ex:50,50,70)">
              <br><br>
              <button  id="valuesBtn" onclick="reduce()">Reduce</button>

              <h3 id="reduceResult"></h3>
            </div>
          </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">indexof() method</h1>

              <input type="text" id="indexof" placeholder="Enter erray values like: a,b,c,d,...">
              <br><br>
              <input type="text" id="indexof2" placeholder="Enter value to find">
              <br><br>
              <button id="indexofBtn" onclick="findIndex()">indexof</button> 

              <h3 id="indexofResult"></h3>
            </div>
          </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">includes()</h1>

              <input type="text" id="includes" placeholder="Enter erray values like: a,b,c,d,...">
              <br><br>
              <input type="text" id="includes2" placeholder="Enter value to find">
              <br><br>
              <button id="includesBtn" onclick="includes()">check Includes</button> 

              <h3 id="includesResult"></h3>
            </div>
          </div>
        </div>
      </div>


      <div class="row">
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">sort() method</h1>

              <input type="text" id="sort" placeholder="enter erray values (e.g. b,d,a,c,e)">
              <br><br>

              <button id="sortBtn" onclick="sort()">short</button>

              <h3 id="shortResult"></h3>
            </div>
          </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">descending order method</h1>

               <input type="text" id="des" placeholder="enter erray values (e.g. a,b,c,d)">
              <br><br>

              <button id="desBtn" onclick="des()">short</button>

              <h3 id="desResult"></h3>
            </div>
          </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">join() method</h1>

              <input type="text" id="join" placeholder="enter array (e.g, a,c,d,..)">
              <br><br>
              <button onclick="join()">Join</button>

              <h3 id="joinResult"></h3>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">slice() method</h1>

              <input type="text" id="slice" placeholder="enter array values">
              <br><br>
              <input type="number" id="slice2" placeholder="enter start index">
              <br><br>
              <input type="number" id="slice3" placeholder="enter end index">
              <br><br>
              <button onclick="slice()">slice</button>

              <h3 id="sliceResult"></h3>
            </div>
          </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">find() method</h1>
            </div>
          </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">findIndex() method</h1>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">every method</h1>
            </div>
          </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">filter() method</h1>
            </div>
          </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">map() method</h1>
            </div>
          </div>
        </div>
      </div>

       <div class="row">
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="card-body d-flex flex-column">
              <h1 class="text-center">flat() method</h1>
            </div>
          </div>
        </div>
        
        
      </div>
    </div>
    <script src="array1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
