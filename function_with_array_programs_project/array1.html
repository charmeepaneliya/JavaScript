        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
          <div class="card-body d-flex flex-column">
            <h1 class="text-center">Splice function</h1>
            <input type="text" id="arr" placeholder="enter array 1,2,3,4,5,..." >
            <br><br>

            <input type="number" id="input" placeholder="add index">            
            <br><br>

            <input type="number" id="value" placeholder="value">           
            <br><br>

            <button onclick="add()">Add</button>
            <button onclick="remove()">Remove</button>
             <button onclick="replace()">replace</button>
            
            <h3 id="result"></h3>

          </div>
        </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
            <div class="card" style="width: 18rem;">
              <div class="card-body d-flex flex-column">
                <h1 class="text-center">some method</h1>
               <input type="text" id="someArr" placeholder="enter array 1,2,3,4,5,..." >
               <br><br>

               <input type="number" id="value" placeholder="check value" >
               <br><br>

               <button id="some" onclick="some()">Some</button>

               <h3 id="someResult"></h3>
              </div>
            </div>
        </div>
        <div class="col col-md-4 d-flex g-5">
          <div class="card" style="width: 18rem;">
            <div class="car-body d-flex flex-column">
              <h1 class="text-center mt-4">Reverse method</h1>

              <input type="text" id="Rev" placeholder="enter array 1,2,3,...">
              <br><br>
              <button id="revBtn" onclick="reverse()">Reverse</button>

              <h3 id="revResult"></h3>
            </div>
          </div>
        </div>
        
      </div>
