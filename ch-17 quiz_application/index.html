<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quize Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
      <div class="row">
        <div class="card rounded-5 quiz-card"  style="width: 40rem;">
            <div class="card-body">
                <h1 class="card-title text-center " >Quize Application</h1>
            <div class="d-flex justify-content-between mb-3">
                <span id="qusNumber" class="fs-4 text-white">1/10</span>
                <span id="timer" class="text-danger fw-bold fs-4">30</span>
            </div>
            <h3 id="qus" class="text-center"></h3>
            
            <div id="options" class="option row mt-3 q-3 g-4 ms-5"></div>
            
            <div class="d-flex justify-content-center mt-3 ">
                 <button id="nextBtn" onclick="nextQus()" class="btn btn-outline-light w-100 rounded-5 fw-bold" >Next</button>
            </div>
           
            </div>
            

        </div>
      </div>
        
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
